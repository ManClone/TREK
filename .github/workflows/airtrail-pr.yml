name: AirTrail export PR validation

on:
  pull_request:
    branches: [dev]
    paths:
      - 'server/src/nest/integrations/airtrail*'
      - 'server/src/db/repositories/Reservations.repository.ts'
      - '.github/workflows/airtrail-pr.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-airtrail:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build shared workspace
        run: npm run build --workspace=shared
      - name: Typecheck server
        run: npm run typecheck --workspace=server
      - name: Typecheck server tests
        run: npm run typecheck:tests --workspace=server
      - name: AirTrail export unit tests
        run: npm run test --workspace=server -- src/nest/integrations/airtrail-export.helpers.spec.ts src/nest/integrations/airtrail-export.service.spec.ts
      - name: Build server
        run: npm run build --workspace=server
